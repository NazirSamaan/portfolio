name: Publish portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REACT_APP_SUPABASE_URL: ${{ vars.REACT_APP_SUPABASE_URL }}
      REACT_APP_SUPABASE_ANON_KEY: ${{ vars.REACT_APP_SUPABASE_ANON_KEY }}
      REACT_APP_FORMSPREE_ENDPOINT: ${{ vars.REACT_APP_FORMSPREE_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check public service configuration
        run: |
          node -e "for (const key of ['REACT_APP_SUPABASE_URL','REACT_APP_SUPABASE_ANON_KEY','REACT_APP_FORMSPREE_ENDPOINT']) if (!process.env[key]) throw new Error(key + ' is missing from repository variables')"
      - run: npm ci --no-audit --no-fund
      - run: npm test -- --watchAll=false --runInBand
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
